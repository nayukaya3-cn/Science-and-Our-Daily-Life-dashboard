# 脆弱性スキャン：push・PRのたび＋毎週月曜（日本時間 8:52）
name: security-scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "52 23 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依存ライブラリの既知の脆弱性（pip-audit）
        run: |
          pip install -q pip-audit
          pip-audit -r requirements.txt --desc
      - name: コードの危険なパターン（bandit）
        run: |
          pip install -q bandit
          # B311（random）は教材の乱数で、暗号用途ではないため除外
          bandit -q -r . -x ./tests,./.venv --skip B311
