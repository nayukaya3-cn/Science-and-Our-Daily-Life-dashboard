# 脆弱性スキャン：push・PRのたび＋毎週月曜（日本時間 8:52）
name: security-scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "52 23 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: 依存ライブラリの既知の脆弱性（pip-audit）
        run: |
          pip install -q "pip-audit==2.10.1"
          pip-audit -r requirements.txt --desc
      - name: コードの危険なパターン（bandit）
        run: |
          pip install -q "bandit==1.9.4"
          # B311（random）は教材の乱数で暗号用途ではない、B101（assert）は自己チェック用のため除外
          bandit -q -r . -x ./tests,./.venv --skip B311,B101
